<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="AI automation, customer support automation, lead capture, scheduling automation, AI chatbot, business automation, no-code automation">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="author" content="AutoPilotAI">
    <meta name="theme-color" content="#3b82f6">

    <!-- Geo Tags -->
    <meta name="geo.country" content="IN">
    <meta name="geo.placename" content="India">

    <!-- Additional SEO Tags -->
    <meta name="revisit-after" content="7 days">
    <meta name="language" content="English">

    <!-- Search Engine Verification (via environment variables) -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_VERIFICATION%">
    <meta name="msvalidate.01" content="%VITE_BING_VERIFICATION%">

    <!-- Organization Schema (static fallback; overridden dynamically per-page) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AutoPilotAI",
      "alternateName": ["Auto Pilot AI", "AutoPilot AI", "AutopilotAI"],
      "url": "https://autopilotaihq.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://i.postimg.cc/DzwJ1cyC/Autopilot-AI-logo.png",
        "width": 512,
        "height": 512
      },
      "description": "AutoPilotAI automates customer support, scheduling, lead capture, and more with intelligent AI.",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-8287046925",
        "contactType": "Customer Service",
        "email": "Solution@AutopilotAihq.com",
        "areaServed": "IN",
        "availableLanguage": "en-US"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN",
        "addressLocality": "India"
      },
      "sameAs": [
        "https://x.com/AutopilotAiHQ",
        "https://www.instagram.com/AutopilotAiHQ/"
      ]
    }
    </script>

    <!-- WebSite Schema with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AutoPilotAI",
      "url": "https://autopilotaihq.com",
      "description": "AI automation platform for customer support, scheduling, lead capture, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://autopilotaihq.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- LocalBusiness Schema for GEO targeting -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "AutoPilotAI",
      "description": "AI automation platform for customer support, scheduling, lead capture, and more.",
      "url": "https://autopilotaihq.com",
      "logo": "https://i.postimg.cc/DzwJ1cyC/Autopilot-AI-logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-8287046925",
        "contactType": "Customer Service",
        "email": "Solution@AutopilotAihq.com"
      },
      "areaServed": [
        {
          "@type": "Country",
          "name": "IN"
        },
        {
          "@type": "Country",
          "name": "US"
        },
        {
          "@type": "Country",
          "name": "UK"
        }
      ],
      "serviceArea": {
        "@type": "Country",
        "name": "IN"
      }
    }
    </script>

    <!-- Service Schema describing automation offerings -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "AI Automation Services",
      "description": "Comprehensive AI automation solutions for customer support, scheduling, lead capture, and business automation",
      "provider": {
        "@type": "Organization",
        "name": "AutoPilotAI",
        "url": "https://autopilotaihq.com"
      },
      "hasOfferingDescription": [
        {
          "@type": "Offer",
          "name": "Customer Support Automation",
          "description": "Automate customer support with AI chatbots and intelligent routing"
        },
        {
          "@type": "Offer",
          "name": "Lead Capture & Qualification",
          "description": "Capture and qualify leads automatically with AI-powered forms and workflows"
        },
        {
          "@type": "Offer",
          "name": "Scheduling Automation",
          "description": "Automate appointment scheduling and calendar management"
        },
        {
          "@type": "Offer",
          "name": "Business Process Automation",
          "description": "Streamline and automate repetitive business processes"
        }
      ],
      "areaServed": "IN",
      "availableLanguage": "en"
    }
    </script>

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
